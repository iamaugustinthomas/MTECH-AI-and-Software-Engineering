name: Compile LaTeX
on: [push]

# Grant write permissions so the runner can save the PDF to your files
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: 01_Academics/Semester_1/Mathematics_for_Computing/05_Assignments/Assignment_01

      # New Step: Permanently commit the generated PDF back into your folder
      - name: Commit and Push PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated PDF generation [skip ci]"
          file_pattern: "01_Academics/Semester_1/Mathematics_for_Computing/05_Assignments/Assignment_01/main.pdf"
